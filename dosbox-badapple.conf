[sdl]
output=opengl

[dosbox]
machine=svga_s3
captures=build\capture
memsize=32

[cpu]
core=dynamic
cputype=auto
cycles=max

[mixer]
rate=44100

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
oplmode=auto
oplrate=44100

[autoexec]
mount c .
c:
BADAPPLE.EXE -file BADAPPLE.WAD -config BADAPPLE.CFG
